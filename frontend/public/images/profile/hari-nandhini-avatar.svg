<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B16"/>
      <stop offset="50%" stop-color="#0A1424"/>
      <stop offset="100%" stop-color="#0E1D33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#FF852E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(22, 139, 255, 0.08)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 217, 255, 0.2)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="15" y="15" width="570" height="570" rx="12" fill="none" stroke="rgba(22, 139, 255, 0.3)" stroke-width="1.5"/>
  <line x1="15" y1="45" x2="120" y2="15" stroke="#FF852E" stroke-width="2" opacity="0.6"/>

  <!-- Corner Brackets -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#168BFF" stroke-width="3"/>
  <path d="M 555 15 L 585 15 L 585 45" fill="none" stroke="#168BFF" stroke-width="3"/>
  <path d="M 15 555 L 15 585 L 45 585" fill="none" stroke="#FF852E" stroke-width="3"/>
  <path d="M 555 585 L 585 585 L 585 555" fill="none" stroke="#FF852E" stroke-width="3"/>

  <!-- Top Badge -->
  <rect x="35" y="32" width="130" height="24" rx="4" fill="rgba(22, 139, 255, 0.15)" stroke="rgba(56, 217, 255, 0.4)" stroke-width="1"/>
  <circle cx="47" cy="44" r="4" fill="#FF852E"/>
  <text x="58" y="48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38D9FF" letter-spacing="1">PROFILE</text>

  <!-- Center Icon Graphic -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="48" fill="rgba(22, 139, 255, 0.08)" stroke="rgba(56, 217, 255, 0.3)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="32" fill="rgba(10, 20, 36, 0.8)" stroke="#168BFF" stroke-width="2"/>
    <polygon points="0,-16 14,8 -14,8" fill="none" stroke="#FF852E" stroke-width="2"/>
    <circle cx="0" cy="-2" r="3" fill="#38D9FF"/>
  </g>

  <!-- Main Title -->
  <text x="300" y="350" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#F4F7FC" letter-spacing="0.5">HARI NANDHINI S</text>

  <!-- Subtitle -->
  <text x="300" y="378" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#9BAAC0">Software Developer & AI/ML Specialist</text>

  <!-- Bottom File Indicator -->
  <rect x="130" y="545" width="340" height="26" rx="6" fill="rgba(5, 11, 22, 0.85)" stroke="rgba(255, 133, 46, 0.3)" stroke-width="1"/>
  <text x="300" y="562" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF852E">REPLACE: hari-nandhini-avatar.svg</text>
</svg>