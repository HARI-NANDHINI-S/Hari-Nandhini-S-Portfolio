<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="50%" stop-color="#38D9FF"/>
      <stop offset="100%" stop-color="#FF852E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#050B16"/>
  <!-- Hexagon border -->
  <polygon points="50,8 88,28 88,72 50,92 12,72 12,28" fill="none" stroke="url(#grad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Initials HN -->
  <text x="50" y="60" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="34" fill="#F4F7FC" letter-spacing="-1">HN</text>
  <circle cx="70" cy="36" r="3.5" fill="#FF852E"/>
</svg>

