version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hn_portfolio_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/portfolio.db:/app/backend/portfolio.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hn_portfolio_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

